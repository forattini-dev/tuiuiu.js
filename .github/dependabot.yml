version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript majors can change the compiler/runtime contract and must be
      # migrated deliberately instead of riding a grouped tooling update.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Keep Node's declarations aligned with the supported runtime matrix.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
