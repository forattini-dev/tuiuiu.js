name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish-next:
        description: Publish an explicit prerelease to the next tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  quality:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Type-check tests
        run: pnpm typecheck:tests

      - name: Check runtime import cycles
        run: pnpm check:cycles

      - name: Build
        run: pnpm build

      - name: Test real PTY lifecycle
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: pnpm test:pty
        env:
          TUIUIU_RUN_PTY: 'true'

      - name: Test
        run: pnpm test:run

      - name: Verify public contracts
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: pnpm verify:contracts

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit all dependencies
        run: pnpm audit --audit-level high

  benchmark:
    name: Performance regression suite
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmarks
        run: pnpm test:performance
        env:
          TUIUIU_RUN_BENCHMARKS: 'true'

  publish-npm:
    name: Publish npm
    needs: [quality, audit]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs['publish-next'])
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.9.0

      - name: Setup Node.js for npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select release version
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PACKAGE_VERSION="$(node -p "require('./package.json').version")"
            test "$VERSION" = "$PACKAGE_VERSION" || {
              echo "Tag v$VERSION does not match package version $PACKAGE_VERSION" >&2
              exit 1
            }
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(node -p "require('./package.json').version")-next.${GITHUB_SHA::12}"
            npm pkg set "version=$VERSION"
            echo "channel=next" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: pnpm build

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --tag "${{ steps.release.outputs.channel }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github:
    name: Publish GitHub package
    needs: [quality, audit]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs['publish-next'])
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.9.0

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@forattini-dev'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare package identity
        id: release
        shell: bash
        run: |
          npm pkg set "name=@forattini-dev/tuiuiu.js"
          npm pkg set "publishConfig.registry=https://npm.pkg.github.com"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PACKAGE_VERSION="$(node -p "require('./package.json').version")"
            test "$VERSION" = "$PACKAGE_VERSION" || {
              echo "Tag v$VERSION does not match package version $PACKAGE_VERSION" >&2
              exit 1
            }
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(node -p "require('./package.json').version")-next.${GITHUB_SHA::12}"
            npm pkg set "version=$VERSION"
            echo "channel=next" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        run: pnpm build

      - name: Publish to GitHub Packages
        run: npm publish --access public --tag "${{ steps.release.outputs.channel }}"
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

  github-release:
    name: Create GitHub release
    needs: [publish-npm, publish-github]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
